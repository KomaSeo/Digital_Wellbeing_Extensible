[package]
name = "digital-wellbeing-service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "digital-wellbeing-service"
path = "src/main.rs"

[dependencies]
enforcer = { workspace = true }
list_based_rule = { workspace = true }
ai_focus_rule = { workspace = true }
machine = { workspace = true }
task_planner = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13" }

# The Windows end-to-end test makes real windows and watches their keyboard input.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
