[workspace]
resolver = "2"
members = [
    "crates/persistence",
    "crates/list_based_rule",
    "crates/browser_rule",
    "crates/content_filter",
    "crates/word_based_filter",
    "crates/llm_based_filter",
    "crates/enforcer",
    "crates/tool-api",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Digital Wellbeing"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
directories = "6"
egui = "0.31"
persistence = { path = "crates/persistence" }
list_based_rule = { path = "crates/list_based_rule" }
browser_rule = { path = "crates/browser_rule" }
enforcer = { path = "crates/enforcer" }
content_filter = { path = "crates/content_filter" }
word_based_filter = { path = "crates/word_based_filter" }
llm_based_filter = { path = "crates/llm_based_filter" }
tool-api = { path = "crates/tool-api" }
