[workspace]
resolver = "2"
members = [
    "crates/list_based_rule",
    "crates/enforcer",
    "crates/rule_ui",
    "crates/tool-api",
    "crates/ai_focus_rule",
    "crates/task_planner",
    "crates/machine",
    "apps/service",
    "apps/focus",
    "apps/desktop",
    "apps/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Digital Wellbeing"]

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
directories = "6"
egui = "0.31"
list_based_rule = { path = "crates/list_based_rule" }
enforcer = { path = "crates/enforcer" }
rule_ui = { path = "crates/rule_ui" }
tool-api = { path = "crates/tool-api" }
ai_focus_rule = { path = "crates/ai_focus_rule" }
machine = { path = "crates/machine" }
task_planner = { path = "crates/task_planner" }
