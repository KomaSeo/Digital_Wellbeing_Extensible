# Responsibility: Build, test and package Digital Wellbeing on Windows, and
# publish the setup program and a zip as a GitHub pre-release.
#
# A release is published when
# - a `v*` tag is pushed, or
# - a branch push changes installer/RELEASE_VERSION: the workflow then
#   creates the tag `v<version>` itself (unless that tag already exists).
# A manual run (workflow_dispatch) only builds and uploads the artifacts.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["installer/RELEASE_VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            $publish = "true"
          } else {
            $v = (Get-Content installer\RELEASE_VERSION -Raw).Trim()
            # A branch push publishes only a version that has no tag yet.
            $existing = git ls-remote --tags origin "refs/tags/v$v"
            $publish = if ("${{ github.event_name }}" -eq "push" -and -not $existing) { "true" } else { "false" }
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Setup program (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc installer\DigitalWellbeing.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $stage = "dist\DigitalWellbeing-$v"
          New-Item -ItemType Directory -Force "$stage\docs" | Out-Null
          Copy-Item target\release\digital-wellbeing-service.exe, target\release\digital-wellbeing-focus.exe, target\release\digital-wellbeing.exe, installer\install.cmd $stage
          Copy-Item docs\*.md "$stage\docs"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\DigitalWellbeing-$v-windows-x64.zip"
          Remove-Item -Recurse $stage

      - uses: actions/upload-artifact@v4
        with:
          name: digital-wellbeing-windows
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Digital Wellbeing ${{ steps.version.outputs.value }}
          prerelease: true
          body_path: installer/RELEASE_NOTES.md
          files: dist/*
