# Responsibility: Build, test and package Digital Wellbeing on Windows, and
# publish the setup program and a zip as a GitHub pre-release.
#
# A release is published when
# - a `v*` tag is pushed, or
# - a branch push changes installer/RELEASE_VERSION: the workflow then
#   creates the tag `v<version>` itself (unless that tag already exists).
# A manual run (workflow_dispatch) only builds and uploads the artifacts.
#
#
# The old sync branch (`claude/multi-device-sync`, now merged) never publishes a `v*` release:
# a push of it that changes the version publishes its setup program to the release
# `sync-windows-latest`, where builds made on that branch look for updates. Its last such
# build has the numbered releases' update check, so those PCs move over to them.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["installer/RELEASE_VERSION"]
  workflow_dispatch:

permissions:
  contents: write

# One run of a branch at a time: two runs replacing the release `sync-windows-latest` at once
# would delete each other's files. A newer push waits for the running one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches are scoped to a ref: a tag run can never read another tag's
      # cache, so only branch runs (RELEASE_VERSION releases) save one, and
      # the next branch run starts with compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref_type == 'branch' }}

      # Tests in the release profile: the build below then reuses everything
      # already compiled instead of compiling the workspace a second time.
      - name: Test
        run: cargo test --workspace --locked --release

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            $publish = "true"
          } else {
            $v = (Get-Content installer\RELEASE_VERSION -Raw).Trim()
            # A branch push publishes only a version that has no tag yet.
            $existing = git ls-remote --tags origin "refs/tags/v$v"
            $publish = if ("${{ github.event_name }}" -eq "push" -and -not $existing -and "${{ github.ref_name }}" -ne "claude/multi-device-sync") { "true" } else { "false" }
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Setup program (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc installer\DigitalWellbeing.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The real setup program, silently: it installs and starts the service; its uninstaller
      # removes the service and, when silent (no one to ask), keeps the owner's data.
      - name: The setup program installs and uninstalls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist\DigitalWellbeing-Setup-*.exe | Select-Object -First 1).FullName
          $run = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "setup failed ($($run.ExitCode))" }
          if ((Get-Service DigitalWellbeing).Status -ne "Running") { throw "the service does not run after setup" }
          $data = "C:\ProgramData\DigitalWellbeing"
          if (-not (Test-Path $data)) { throw "setup made no data folder" }
          $uninstaller = "C:\Program Files\DigitalWellbeing\unins000.exe"
          $run = Start-Process $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the uninstaller failed ($($run.ExitCode))" }
          # The uninstaller goes on from a copy of itself; wait until the service is gone.
          $deadline = (Get-Date).AddSeconds(120)
          while (Get-Service DigitalWellbeing -ErrorAction SilentlyContinue) {
            if ((Get-Date) -gt $deadline) { throw "the uninstaller left the service" }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $data)) { throw "a silent uninstall deleted the owner's data" }

      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $stage = "dist\DigitalWellbeing-$v"
          New-Item -ItemType Directory -Force "$stage\docs" | Out-Null
          Copy-Item target\release\digital-wellbeing-service.exe, target\release\digital-wellbeing-focus.exe, target\release\digital-wellbeing-mcp.exe, installer\install.cmd $stage
          Copy-Item docs\*.md "$stage\docs"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\DigitalWellbeing-$v-windows-x64.zip"
          Remove-Item -Recurse $stage

      - name: Publish to the release "sync-windows-latest" (sync branch)
        if: github.ref == 'refs/heads/claude/multi-device-sync'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $build = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force dist-sync | Out-Null
          Copy-Item "dist\DigitalWellbeing-Setup-$v.exe" "dist-sync\DigitalWellbeing-Setup-$v-$build.exe"
          Copy-Item "dist\DigitalWellbeing-$v-windows-x64.zip" "dist-sync\DigitalWellbeing-$v-$build-windows-x64.zip"
          # One build at a time: the old files go with the old release.
          gh release delete sync-windows-latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $files = (Get-ChildItem dist-sync).FullName
          gh release create sync-windows-latest @files --prerelease --latest=false --target "${{ github.sha }}" `
            --title "Sync PC build (latest)" `
            --notes "동기화 브랜치의 최신 PC 빌드입니다. 설정 탭의 '이 프로그램 업데이트'가 여기서 받습니다. 설치 파일을 직접 받아 실행해도 됩니다."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: digital-wellbeing-windows
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Digital Wellbeing ${{ steps.version.outputs.value }}
          prerelease: true
          body_path: installer/RELEASE_NOTES.md
          files: dist/*
