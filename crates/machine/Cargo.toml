[package]
name = "machine"
version.workspace = true
edition.workspace = true

[features]
# The test edition: built and released separately (DigitalWellbeing-Setup-<version>-TEST.exe);
# it can turn the settings protection off again ("보호 풀기"). The main edition cannot.
test-edition = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
ai_focus_rule = { workspace = true }
list_based_rule = { workspace = true }
task_planner = { workspace = true }
enforcer = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
